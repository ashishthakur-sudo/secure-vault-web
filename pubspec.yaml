name: secure_vault
description: Encrypted local file vault for Android, Windows, and macOS.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  archive: ^4.5.2
  bcrypt: ^1.1.3
  cryptography: ^2.7.0
  cryptography_flutter: ^2.3.4
  encrypt: ^5.0.3
  file_picker: ^13.1.0
  flutter_secure_storage: ^11.2.0
  media_kit: ^1.2.6
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^2.0.1
  path: ^1.9.1
  path_provider: ^2.1.5
  pdfx: ^2.8.0
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.6
  idb_shim: ^2.10.1+1
  web: ^1.1.1
  http: ^1.3.0
  xml: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
